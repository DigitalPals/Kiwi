name: Android app

# Builds and tests Kiwi's Android app when it changes. It runs on GitHub because fast-test and the nightly run
# don't cover it (they have no Android SDK); the rest of CI is in ci.yml.

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android app
    # Always GitHub-hosted: ubuntu-latest comes with an Android SDK, while the Beast runner VMs
    # have no JDK or Android SDK and the Kiwi lane (2 vCPUs, 3 GiB) is too small for Gradle and R8.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The committed gradle-wrapper.jar must be one Gradle published.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.gradle.kts
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"
      - run: ./gradlew --no-daemon --console=plain test assembleRelease
