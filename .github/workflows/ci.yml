name: CI

# Not on every push: `fast-test` checks each change (AGENTS.md) and The Beast runs the full suite every night.
# By hand from the Actions tab, and weekly, so newly published advisories (Dependency audit), toolchain drift and
# the macOS and Docker jobs, which nothing else runs, still show up. The Android app has its own workflow
# (android.yml).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

# Linux x64 jobs of trusted events run on ephemeral Beast VMs (DigitalPals/ci-platform
# github-runners): push, workflow_dispatch, schedule and same-repository pull requests.
# Fork pull requests, and everything while the BEAST_RUNNERS variable is "off", use
# GitHub-hosted runners. The Beast runners' job hook rejects any other event as well.
jobs:
  rust:
    name: Rust
    # The Rust job always uses the same warm Beast slot (persistent cargo target dir).
    runs-on: ${{ vars.BEAST_RUNNERS != 'off' && (contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","beast-kiwi-rust"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      # Beast VMs keep cargo, rustup and sccache on their persistent cache volume.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web app
    runs-on: &linux-x64 ${{ vars.BEAST_RUNNERS != 'off' && (contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","beast-kiwi"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  macos:
    name: Rust (macOS)
    # The platform Kiwi is made for: the macOS code paths (codesign, devicectl, the keychain,
    # the LaunchAgent) compile and their tests run here. Signing for real and talking to real
    # devices stay manual (the #[ignore]d tests in docs/development.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Kiwi Builds tests run fake runners with python3 from PATH.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # macOS's own bash (3.2) runs install.sh and uninstall.sh on a Mac.
      - run: /bin/bash -n install.sh && /bin/bash -n uninstall.sh

  audit:
    name: Dependency audit
    runs-on: *linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      # Known advisories that don't affect Kiwi are listed, with reasons, in .cargo/audit.toml.
      - run: cargo audit

  python:
    name: Kiwi Builds runner
    runs-on: *linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest automation/test_runner.py automation/test_android.py

  shell:
    name: Scripts
    runs-on: *linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck install.sh uninstall.sh deploy/deploy.sh android/scripts/build-in-docker.sh

  docker:
    name: Docker image
    # Builds the image without publishing it, and checks compose.yaml. GitHub-hosted on
    # purpose: the Beast runner VMs may not provide a Docker daemon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: kiwi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose config --quiet
