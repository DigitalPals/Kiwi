name: CI

on:
  push:
  pull_request:
  # Weekly, so newly published advisories (Dependency audit) and toolchain drift show up
  # without a push.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

# Linux x64 jobs of trusted events run on ephemeral Beast VMs (DigitalPals/ci-platform
# github-runners): push, workflow_dispatch, schedule and same-repository pull requests.
# Fork pull requests, and everything while the BEAST_RUNNERS variable is "off", use
# GitHub-hosted runners. The Beast runners' job hook rejects any other event as well.
jobs:
  rust:
    name: Rust
    # The Rust job always uses the same warm Beast slot (persistent cargo target dir).
    runs-on: ${{ vars.BEAST_RUNNERS != 'off' && (contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","beast-kiwi-rust"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The version in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      # Beast VMs keep cargo, rustup and sccache on their persistent cache volume.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web app
    runs-on: &linux-x64 ${{ vars.BEAST_RUNNERS != 'off' && (contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","beast-kiwi"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  macos:
    name: Rust (macOS)
    # The platform Kiwi is made for: the macOS code paths (codesign, devicectl, the keychain,
    # the LaunchAgent) compile and their tests run here. Signing for real and talking to real
    # devices stay manual (the #[ignore]d tests in docs/development.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Kiwi Builds tests run fake runners with python3 from PATH.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # macOS's own bash (3.2) runs install.sh and uninstall.sh on a Mac.
      - run: /bin/bash -n install.sh && /bin/bash -n uninstall.sh

  audit:
    name: Dependency audit
    runs-on: *linux-x64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      # Known advisories that don't affect Kiwi are listed, with reasons, in .cargo/audit.toml.
      - run: cargo audit

  python:
    name: Kiwi Builds runner
    runs-on: *linux-x64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest automation/test_runner.py automation/test_android.py

  shell:
    name: Scripts
    runs-on: *linux-x64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: shellcheck install.sh uninstall.sh deploy/deploy.sh android/scripts/build-in-docker.sh

  docker:
    name: Docker image
    # Builds the image without publishing it, and checks compose.yaml. GitHub-hosted on
    # purpose: the Beast runner VMs may not provide a Docker daemon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: kiwi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose config --quiet

  android:
    name: Android app
    # Always GitHub-hosted: ubuntu-latest comes with an Android SDK, while the Beast runner VMs
    # have no JDK or Android SDK and the Kiwi lane (2 vCPUs, 3 GiB) is too small for Gradle and R8.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The committed gradle-wrapper.jar must be one Gradle published.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.gradle.kts
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"
      - run: ./gradlew --no-daemon --console=plain test assembleRelease
