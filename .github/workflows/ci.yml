name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Linux x64 jobs of trusted events run on ephemeral Beast VMs (DigitalPals/ci-platform
# github-runners): push, workflow_dispatch, schedule and same-repository pull requests.
# Fork pull requests, and everything while the BEAST_RUNNERS variable is "off", use
# GitHub-hosted runners. The Beast runners' job hook rejects any other event as well.
jobs:
  rust:
    name: Rust
    # The Rust job always uses the same warm Beast slot (persistent cargo target dir).
    runs-on: ${{ vars.BEAST_RUNNERS != 'off' && (contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","beast-kiwi-rust"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Beast VMs keep cargo, rustup and sccache on their persistent cache volume.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web app
    runs-on: &linux-x64 ${{ vars.BEAST_RUNNERS != 'off' && (contains(fromJSON('["push","workflow_dispatch","schedule"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","beast-kiwi"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: Kiwi Builds runner
    runs-on: *linux-x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m pytest automation/test_runner.py automation/test_android.py

  shell:
    name: Scripts
    runs-on: *linux-x64
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck install.sh uninstall.sh deploy/deploy.sh android/scripts/build-in-docker.sh

  android:
    name: Android app
    # Always GitHub-hosted: ubuntu-latest comes with an Android SDK, while the Beast runner VMs
    # have no JDK or Android SDK and the Kiwi lane (2 vCPUs, 3 GiB) is too small for Gradle and R8.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      # The committed gradle-wrapper.jar must be one Gradle published.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.gradle.kts
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"
      - run: ./gradlew --no-daemon --console=plain test assembleRelease
