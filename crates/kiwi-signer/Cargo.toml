[package]
name = "kiwi-signer"
description = "Provisioning profiles, signing identities and IPA re-signing with Apple's codesign or rcodesign."
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Test identities, profiles and IPAs for other crates' tests.
test-support = ["dep:semver"]

[dependencies]
base64.workspace = true
chrono.workspace = true
hex.workspace = true
plist.workspace = true
serde.workspace = true
sha1 = "0.11"
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
zeroize = "1"
zip.workspace = true

# Signing without Apple's tools (the files backend): rcodesign's library. MPL-2.0, used
# unmodified as a dependency.
[target.'cfg(not(target_os = "macos"))'.dependencies]
apple-bundles = "0.21"
apple-codesign = { version = "0.29", default-features = false }
# PKCS#12, as apple-codesign reads it (Kiwi keeps the chain to find the identity's certificate).
p12 = "0.6"
regex = "1"
semver = { version = "1", optional = true }
x509-certificate = "0.25"
yasna = "0.5"

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
semver = "1"
